repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2  # v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/psf/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e  # v26.5.1
    hooks:
      - id: black
        files: ^src/backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-json
      - id: check-toml
  - repo: local
    hooks:
      - id: os-setup-preflight
        name: OS-Setup Preflight (FM-02/03/04/07/08/09/10/11/13/14)
        entry: bash /Users/srujansai/Desktop/Adaptoid-OS/validators/preflight.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: block-secrets
        name: Block accidental secret commits
        entry: bash orchestrator/hooks/block-secrets.sh
        language: system
        pass_filenames: false
