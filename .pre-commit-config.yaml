repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^src/backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-json
      - id: check-toml
  - repo: local
    hooks:
      - id: os-setup-preflight
        name: OS-Setup Preflight (FM-02/03/04/07/08/09/10/11/13/14)
        entry: bash /Users/srujansai/Desktop/Adaptoid-OS/validators/preflight.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: block-secrets
        name: Block accidental secret commits
        entry: bash orchestrator/hooks/block-secrets.sh
        language: system
        pass_filenames: false
