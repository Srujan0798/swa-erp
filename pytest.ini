# pytest.ini — NOT CREATED

Reason: pyproject.toml is the single source of pytest configuration.
Creating pytest.ini would duplicate config (FM-06: config revert risk).

Relevant section in pyproject.toml:
  [tool.pytest.ini_options]
  testpaths = ["tests"]
  python_files = ["test_*.py"]
  addopts = "-v --tb=short --import-mode=importlib"
  asyncio_mode = "auto"

The --import-mode=importlib flag (required for wave-33 test collection)
lives here and must not drift to a separate file.
