# Wave-43 Eval Task 003
# Client workflow: RBAC enforcement — each role sees exactly what it should;
# a Viewer cannot mutate.
id: 003-rbac-enforcement
name: "RBAC enforcement"
description: |
  The client role hierarchy (src/backend/core/roles.py):
    ADMIN > {PM > {DESIGNER > VIEWER}}
  role_includes() implements the subset test. require_role() is the server-side guard.
  This task validates that the access matrix holds on the live API — not just that
  endpoints return 403, but that the DB state did NOT change when a forbidden actor
  attempted a write. A Viewer getting 500 instead of 403 is a bug, not a pass.
input:
  project_name: "RBAC Project"
  project_code: "RBAC-PRJ-001"
agent_steps:
  - step: 1   # setup: admin creates a client + project
    actor: "admin"
    action: "POST /api/clients"
    body:
      name: "RBAC Client"
      code: "RBAC-C-001"
      primary_email: "rbac@test.com"
    expect_status: 201
    capture: client_id
  - step: 2
    actor: "admin"
    action: "POST /api/projects"
    body:
      client_id: $ref:step.1.client_id
      name: "RBAC Project"
      code: "RBAC-PRJ-001"
      status: "Lead"
    expect_status: 201
    capture: project_id
  - step: 3   # read: viewer can read projects (require_role VIEWER)
    actor: "viewer"
    action: "GET /api/projects/$ref:step.2.project_id"
    expect_status: 200
  - step: 4   # mutate: viewer cannot create a client (require_role PM)
    actor: "viewer"
    action: "POST /api/clients"
    body:
      name: "Hack Client"
      code: "HACK-001"
      primary_email: "hack@test.com"
    expect_status: 403
  - step: 5   # mutate: viewer cannot change project (require_role PM on PATCH)
    actor: "viewer"
    action: "PATCH /api/projects/$ref:step.2.project_id"
    body:
      name: "Hacked Name"
    expect_status: 403
verification: |
  code_based.003_rbac:
    - step3.status == 200   (viewer read allowed)
    - step4.status == 403   (viewer create client forbidden — exact, not 500)
    - step5.status == 403   (viewer project update forbidden — exact)
    - DB: no client with code "HACK-001" exists  (mutation had no side-effect)
    - DB: project.name == "RBAC Project"        (name unchanged by viewer PATCH)
grader: code_based.003_rbac
trials: 3
