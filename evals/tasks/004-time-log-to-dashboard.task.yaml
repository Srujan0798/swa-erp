# Wave-43 Eval Task 004
# Client workflow: a logged time entry surfaces correctly in aggregates.
id: 004-time-log-to-dashboard
name: "Time log to dashboard aggregation"
description: |
  A billable time entry must surface in three aggregate views:
  (a) the timesheet for that user/week (total_hours, billable_hours),
  (b) the project P&L (billable cost = billable_hours * DEFAULT_HOURLY_RATE_INR),
  (c) the invoice generate-from-time endpoint.
  Time tracking uses 15-minute increments (constitution §domain). Hours are
  Decimal(4,2). Money is Decimal(18,2). This task validates the numbers, not UI.
input:
  hours_billable: 7.00
  hours_nonbillable: 1.00
  expected_total: "8.00"
  expected_billable: "7.00"
  rate: "5000.00"                # DEFAULT_HOURLY_RATE_INR from settings
  expected_subtotal: "35000.00"  # 7 * 5000
  expected_gst: "6300.00"        # 35000 * 18%
  expected_invoice_total: "41300.00"
agent_steps:
  - step: 1
    actor: "admin"
    action: "POST /api/clients"
    body:
      name: "Time Client"
      code: "TIME-C-001"
      primary_email: "timetest@test.com"
    expect_status: 201
    capture: client_id
  - step: 2
    actor: "admin"
    action: "POST /api/projects"
    body:
      client_id: $ref:step.1.client_id
      name: "Time Project"
      code: "TIME-P-001"
      status: "Lead"
    expect_status: 201
    capture: project_id
  - step: 3
    actor: "admin"
    action: "POST /api/time-entries"
    body:
      project_id: $ref:step.2.project_id
      date: "2026-08-24"   # a Monday
      hours: "7.00"
      description: "Billable engineering"
      is_billable: true
    expect_status: 201
    capture: entry_billable_id
  - step: 4
    actor: "admin"
    action: "POST /api/time-entries"
    body:
      project_id: $ref:step.2.project_id
      date: "2026-08-25"
      hours: "1.00"
      description: "Internal meeting (non-billable)"
      is_billable: false
    expect_status: 201
    capture: entry_nonb_id
  - step: 5
    actor: "admin"
    action: "POST /api/timesheets/generate?week_start=2026-08-24"
    expect_status: 200
    capture: timesheet
  - step: 6
    actor: "admin"
    action: "POST /api/projects/$ref:step.2.project_id/invoices/generate-from-time"
    body:
      start_date: "2026-08-24"
      end_date: "2026-08-30"
    expect_status: 201
    capture: invoice
verification: |
  code_based.004_time_aggregation:
    - timesheet.total_hours == Decimal("8.00")
    - timesheet.billable_hours == Decimal("7.00")
    - timesheet.status == "draft"
    - DB: count(time_entries where project_id == step2.project_id) == 2
    - invoice total == 41300.00, gst_amount == 6300.00, subtotal == 35000.00
    - DB invoice.subtotal is Decimal (not float)
grader: code_based.004_time_aggregation
trials: 3
