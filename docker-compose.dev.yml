# Dev overrides for SWA ERP — hot reload + optional Prometheus.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# What this changes vs the base docker-compose.yml:
#   - backend  : mounts ./src/backend into the container and runs uvicorn --reload
#   - worker   : mounts ./src/backend and runs celery --autoreload
#   - prometheus: (optional) scrapes backend:8000 using prometheus.yml
#
# It does NOT change ports, env, or the database — those stay as defined in the base file.

services:
  backend:
    volumes:
      - ./src/backend:/app/src/backend
    command: ["uvicorn", "src.backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DEBUG: "true"
      # Dev-only: the stock Prometheus scrape config below cannot present a
      # JWT, so /metrics auth is relaxed on this trusted local network.
      # Production (docker-compose.yml / docker-compose.prod.yml) keeps the
      # secure default METRICS_REQUIRE_AUTH=true.
      METRICS_REQUIRE_AUTH: "false"
    # Optional: uncomment if you launch uvicorn with --debugpy and want to attach an IDE
    # ports:
    #   - "5678:5678"

  worker:
    volumes:
      - ./src/backend:/app/src/backend
    command: ["celery", "-A", "src.backend.workers.celery_app", "worker", "--loglevel=info", "--autoreload"]

  # Optional Prometheus for local metrics viewing. Scrapes backend:8000 (see prometheus.yml).
  # NOTE: the backend in THIS file sets METRICS_REQUIRE_AUTH=false so the
  # stock (unauthenticated) scraper works on the trusted dev network. The base
  # and prod compose files keep the secure default (auth required).
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
