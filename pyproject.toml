[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swa-erp"
version = "1.0.1"
description = "Internal ERP for SWA Consultancy Pvt. Ltd."
authors = [{name = "Srujan"}]
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.ruff]
line-length = 100
target-version = "py311"
# Audit scope = project source only (src/, tests/, scripts/, evals/).
# Tool-skill caches and orchestrator workbenches are not project code.
extend-exclude = [
  "src/backend/alembic/versions",
  ".venv",
  "node_modules",
  ".adal",
  ".agents",
  ".claude",
  ".codebuddy",
  ".cursor",
  ".joycode",
  ".kimi-code",
  ".playwright-mcp",
  ".zed",
  "work",
  "orchestrator",
  "attic",
  "prompts",
  "deliverables",
  "resources",
  "results",
  "backups",
  "uploads",
  "schema",
  "scripts/codex",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "RUF"]
ignore = ["E501", "N999"]

[tool.ruff.lint.per-file-ignores]
# `src/backend/__init__.py` re-exports submodules as the public package API (intentional, wave-1 pattern)
"src/backend/__init__.py" = ["F401"]
# A003: `id`/`parent` are SQLAlchemy column/relationship names on TaskComment that
# shadow builtins. Only flagged by ruff >= 0.14 on `remote_side=[id]`; a `# noqa: A003`
# there would be reported as unused by CI-pinned ruff 0.6.3 (RUF100), so it lives here.
"src/backend/models/task.py" = ["A003"]
# Test/dev tolerance: unused locals from AAA-style arrange blocks, uppercase
# locals for locally-imported classes (Session/Client), unpacked-but-unread
# pagination tuples. Style only — never enabled for src/backend/.
"tests/*" = ["F841", "N806", "RUF059"]
"scripts/*" = ["N806"]
"evals/*" = ["N806"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '/alembic/versions/.*\.py'

[tool.mypy]
python_version = "3.11"
strict = false
exclude = ["src/backend/alembic/versions", "src/backend/db/repositories/__init__.py", ".venv", "node_modules"]
# mypy non-strict: duplicate module resolution from editable install causes
# "source found twice" errors. strict-per-module planned for wave-33 follow-up.

# Third-party libs without type stubs. Declared here instead of inline
# `# type: ignore[import-untyped]` so missing-stub intent is centralized
# and greppable. Revisit when stubs appear upstream.
[[tool.mypy.overrides]]
module = ["openpyxl.*", "fpdf.*", "celery.*", "laya.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --import-mode=importlib"
asyncio_mode = "auto"
