[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swa-erp"
version = "1.0.0"
description = "Internal ERP for SWA Consultancy Pvt. Ltd."
authors = [{name = "Srujan"}]
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/backend/alembic/versions", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "RUF"]
ignore = ["E501", "N999"]

[tool.ruff.lint.per-file-ignores]
# `src/backend/__init__.py` re-exports submodules as the public package API (intentional, wave-1 pattern)
"src/backend/__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '/alembic/versions/.*\.py'

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/backend/alembic/versions", ".venv", "node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
