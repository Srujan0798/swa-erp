# Non-blocking evals runner
#
# ⚠️  IMPORTANT: This workflow is intentionally NON-BLOCKING (continue-on-error: true).
#     Evals are new (wave-43) and flaky-by-nature until tuned. They are NOT a real
#     gate. See evals/README.md → "Anti-patterns" §6 for the full justification.
#     Do NOT mistake a green evals check for "CI passes" — it can and will fail
#     randomly until the harness is stabilized.
#
# This workflow runs the code-based evals from evals/graders/code_based.py
# against a seeded Postgres test database. It does NOT touch the protected
# ci.yml / test.yml real gates.
name: Evals

on:
  push:
    branches: [main, "wave-*"]
    paths:
      - "evals/**"
      - "src/backend/**"
      - "tests/conftest.py"
  pull_request:
    branches: [main]
    paths:
      - "evals/**"
      - "src/backend/**"
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    continue-on-error: true   # ← non-blocking by design (see header comment)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swa
          POSTGRES_PASSWORD: swa
          POSTGRES_DB: swa_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://swa:swa@localhost:5432/swa_erp_test
      SECRET_KEY: test-secret-key
      CORS_ORIGINS: '["http://localhost:3100"]'
      DISABLE_AUTH_RATE_LIMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Install PyYAML (for task loader)
        run: pip install pyyaml
      - name: Apply migrations
        run: |
          cd src/backend && alembic upgrade head
      - name: Run evals
        run: python3 evals/run_evals.py --trials 3
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-transcripts
          path: evals/transcripts/
      - name: Upload outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-outcomes
          path: evals/outcomes/
