name: E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swa
          POSTGRES_PASSWORD: swa
          POSTGRES_DB: swa_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://swa:swa@localhost:5432/swa_erp
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: e2e-secret-key
      APP_ENV: dev
      DISABLE_AUTH_RATE_LIMIT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: src/frontend/package-lock.json }
      - name: Install backend deps
        run: pip install -r requirements.txt
      - name: Migrate
        run: alembic -c src/backend/alembic.ini upgrade heads
      - name: Seed dev users
        run: APP_ENV=dev python3 scripts/seed_dev.py
      - name: Start backend
        run: |
          nohup python3 -m uvicorn src.backend.main:app --host 0.0.0.0 --port 8100 > /tmp/e2e-backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8100/healthz && break
            sleep 2
          done
      - name: Install frontend deps
        run: |
          cd src/frontend
          npm ci
      - name: Install Playwright browsers
        run: |
          cd src/frontend
          npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npx playwright test --project=chromium
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
