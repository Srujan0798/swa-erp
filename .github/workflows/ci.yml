name: CI
on:
  push:
    branches: [main, "wave-*"]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python 3.14 on PURPOSE: black's f-string parser (PEP 701) formats
      # differently per interpreter — CI must match .pre-commit-config.yaml's
      # runtime (the developer's python3) or the two disagree forever.
      # ruff is a rust binary; mypy is pinned to python_version=3.11 in
      # pyproject, so target semantics stay 3.11 regardless.
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: "pip" }
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Install lint tools
        # Match .pre-commit-config.yaml exactly (ruff 0.16.1, black 26.5.1);
        # CI and pre-commit must never disagree on tool versions.
        run: pip install ruff==0.16.1 black==26.5.1 mypy==1.11.2
      - name: Ruff check
        run: ruff check src/backend/
      - name: Black check
        run: black --check src/backend/
      - name: Mypy
        run: mypy src/backend/ --explicit-package-bases

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swa
          POSTGRES_PASSWORD: swa
          POSTGRES_DB: swa_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://swa:swa@localhost:5432/swa_erp_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run migrations
        run: |
          if [ -d src/backend/alembic ]; then
            alembic -c src/backend/alembic.ini upgrade heads
          fi
      - name: Run tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Node 22: vitest 4.x forks pool needs undici APIs missing in Node 20
        # (webidl.util.markAsUncloneable); local dev runs Node 22.
        with: { node-version: "22", cache: "npm", cache-dependency-path: src/frontend/package-lock.json }
      - name: Install + build (if frontend exists)
        run: |
          if [ -f src/frontend/package.json ]; then
            cd src/frontend
            npm ci
            npm run lint
            npx tsc --noEmit
            npx vitest run
            npm run build
          else
            echo "Frontend not yet present (Task 04 pending)"
          fi

  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The verifier is fetched from outside the repo under test. A gate that
      # lives in the repo it judges can be edited by whatever is being judged.
      - name: Fetch Adaptoid validators
        run: git clone --depth 1 https://github.com/Srujan0798/Adaptoid-OS.git /tmp/adaptoid-os

      - name: Preflight (25 validators, incl. FM-09b entailment)
        run: bash /tmp/adaptoid-os/validators/preflight.sh .
