name: Security
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pip-audit
      # Accepted-risk ignores (reviewed 2026-09-21, re-check on every bump):
      # PYSEC-2026-2121 (CVE-2026-32274) + PYSEC-2026-2120 (CVE-2026-31900)
      # affect ONLY black-the-dev-formatter (cache-file name / GH action),
      # never shipped code. Bumping black to 26.x would reformat the tree
      # for zero runtime benefit, so the pin stays with explicit ignores.
      - run: pip-audit -r requirements.txt --strict --ignore-vuln PYSEC-2026-2121 --ignore-vuln PYSEC-2026-2120

  npm-audit:
    # 2026-09-21: `npm audit` reports 0 vulnerabilities (vite ^6.4.3,
    # react-router-dom ^7.18.4). Gate stays at high-only as a backstop.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: src/frontend/package-lock.json }
      - name: npm audit
        run: |
          if [ -f src/frontend/package.json ]; then
            cd src/frontend
            npm audit --audit-level=high
          fi

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep
      - run: semgrep --config=auto src/backend/

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t swa-erp-backend:ci -f Dockerfile .
      - name: Install trivy
        # Direct install instead of action pin: action tags have rotted
        # (0.28.0 became unresolvable); apt repo is maintained upstream.
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
      - name: Scan image
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed swa-erp-backend:ci
