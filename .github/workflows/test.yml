name: Test Matrix
on:
  push:
    branches: [main, "wave-*"]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -r requirements.txt
      - run: pytest tests/unit tests/wave-1 -v

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swa
          POSTGRES_PASSWORD: swa
          POSTGRES_DB: swa_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://swa:swa@localhost:5432/swa_erp_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -r requirements.txt
      - run: |
          if [ -d src/backend/alembic ]; then
            alembic -c src/backend/alembic.ini upgrade heads
          fi
      - run: pytest tests/integration tests/security tests/test_migrations.py -v

  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swa
          POSTGRES_PASSWORD: swa
          POSTGRES_DB: swa_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://swa:swa@localhost:5432/swa_erp_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -r requirements.txt
      - run: |
          if [ -d src/backend/alembic ]; then
            alembic -c src/backend/alembic.ini upgrade heads
          fi
      # Contract-style acceptance: RBAC gaps + production hardening + wave seals.
      - run: pytest tests/wave-22 tests/wave-48 tests/wave-50 tests/wave-37 -v
